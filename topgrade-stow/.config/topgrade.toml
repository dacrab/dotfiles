# topgrade.toml - update everything in one run, no prompts.
# System packages, flatpak, firmware, runtimes, and tools are auto-detected.
# Topgrade itself is RPM-managed (terra), so dnf updates it via the system step.

[misc]
assume_yes = true
ask_retry = false
pre_sudo = true
notify_end = "on_failure"
# Clear topgrade's temp/cache dirs after each run.
cleanup = true
# hyprpm: source-builds need a pile of -devel packages we don't keep.
# spicetify, bun, zed, gearlever: replaced by the steps below (the built-ins
# query api.github.com anonymously and die on the shared 60/hour rate limit,
# or — gearlever — cannot be authenticated at all).
disable = ["hyprpm", "spicetify", "bun", "zed", "gearlever"]

# Pull git repos matching ~/Documents/GitHub/*/ (topgrade skips non-repos).
[git]
repos = ["~/Documents/GitHub/*/"]
# Work-in-progress feature branches have no upstream, so `git pull` would fail
# and mark the whole Git Repositories step as FAILED. When a repo is not on its
# default branch, fetch the remote's default branch instead.
fallback_to_fetch_default = true
# NB: no `arguments = "--rebase --autostash"` here. Topgrade also passes those
# arguments to the fallback `git fetch`, which rejects --rebase. The same
# behaviour comes from pull.rebase + rebase.autoStash in ~/.gitconfig instead.

[linux]
dnf_arguments = "--refresh"

# Use sudo for system-wide Flatpak updates.
[flatpak]
use_sudo = true

# Don't prune unused system container images.
[containers]
system_prune = false

# GitHub release steps. Anything on api.github.com without a token is
# unreliable (60 requests/hour per public IP, shared with every other updater
# and browser), so these avoid it:
#   - update-gh-release: anonymous github.com/<repo>/releases/latest redirect.
#   - update-zed: zed.dev stable tarball.
#   - update-bun: `bun upgrade` with GITHUB_TOKEN from `gh auth token`.
#   - update-gearlever: release page HTML for the asset, then download +
#     verify against the release's own .zsync checksum.
[commands]
"GitHub release binaries" = "/home/dacrab/.local/bin/update-gh-release"
"Spicetify" = "/home/dacrab/.local/bin/update-spicetify"
"Bun" = "/home/dacrab/.local/bin/update-bun"
"Zed" = "/home/dacrab/.local/bin/update-zed"
"Gear Lever" = "/home/dacrab/.local/bin/update-gearlever"
