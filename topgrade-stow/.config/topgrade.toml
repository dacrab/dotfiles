# topgrade.toml - update everything in one run, no prompts.
# System packages, flatpak, firmware, runtimes and tools are auto-detected.
# Topgrade itself is RPM-managed (terra), so dnf updates it via the system step.

[misc]
assume_yes = true
ask_retry = false
pre_sudo = true
notify_end = "on_failure"
cleanup = true
# hyprpm: source builds need -devel packages we don't keep.
# spicetify, bun, gearlever: their own updaters query api.github.com anonymously
# and fail on its 60/hour quota, so the [commands] below replace them.
# zed is NOT disabled: the built-in step updates ~/.local/zed.app itself.
disable = ["hyprpm", "spicetify", "bun", "gearlever"]

# Pull git repos matching ~/Documents/GitHub/*/ (topgrade skips non-repos).
[git]
repos = ["~/Documents/GitHub/*/"]
# Feature branches have no upstream, so `git pull` would fail the whole step;
# fetch the remote's default branch instead.
fallback_to_fetch_default = true
# No `arguments = "--rebase --autostash"`: topgrade also passes them to the
# fallback fetch, which rejects --rebase. ~/.gitconfig sets both instead.

[linux]
dnf_arguments = "--refresh"

[flatpak]
use_sudo = true

# Every step avoids the anonymous api.github.com quota: versions come from the
# public releases/latest redirect, the Gear Lever asset from the release page,
# and downloads go through `gh` where a token is needed.
[commands]
"Zoxide" = "~/.local/bin/update-zoxide"
"Spicetify" = "~/.local/bin/update-spicetify"
"Bun" = "~/.local/bin/update-bun"
"Gear Lever" = "~/.local/bin/update-gearlever"
