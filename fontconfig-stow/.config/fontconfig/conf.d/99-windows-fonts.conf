<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- Enable subpixel rendering like Windows ClearType -->
  <match target="font">
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
  </match>

  <!-- Use full hinting for sharper edges -->
  <match target="font">
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>

  <!-- Slight autohinting improves consistency across fonts -->
  <match target="font">
    <edit name="autohint" mode="assign"><bool>true</bool></edit>
  </match>

  <!-- Adjust gamma and contrast for “crisper” look -->
  <match target="font">
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <!-- Slight contrast and DPI tweak for a bit more sharpness -->
  <match target="pattern">
    <edit name="dpi" mode="assign"><double>96</double></edit>
  </match>

</fontconfig>

