# ============================================
# Hyprland — look & feel
# Colors are defined in hyprland/colors.conf.
# ============================================

# ----- General -----
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    resize_on_border = true
    hover_icon_on_border = true
    extend_border_grab_area = 15
    layout = dwindle

    col.active_border = $color4
    col.inactive_border = $color0
    col.nogroup_border = $color8
}

# ----- Decoration -----
decoration {
    rounding = 10
    rounding_power = 2.0
    inactive_opacity = 0.92
    dim_inactive = true
    dim_strength = 0.1

    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
        noise = 0.02
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000055)
    }
}

# ----- Animations -----
animations {
    enabled = true

    bezier = snappy, 0.05, 0.9, 0.1, 1.0
    bezier = smooth, 0.25, 1.0, 0.5, 1.0
    bezier = softOut, 0.36, 0.0, 0.66, -0.56
    bezier = popIn, 0.0, 0.8, 0.2, 1.0

    animation = windowsIn, 1, 4, popIn, popin 80%
    animation = windowsOut, 1, 4, softOut, popin 80%
    animation = windowsMove, 1, 3, smooth

    animation = fadeIn, 1, 3, smooth
    animation = fadeOut, 1, 3, smooth
    animation = fadeSwitch, 1, 3, smooth
    animation = fadeDim, 1, 4, smooth

    animation = workspaces, 1, 4, snappy, slidefade 20%
    animation = specialWorkspace, 1, 4, snappy, slidefadevert -20%

    animation = border, 1, 5, smooth

    animation = layers, 1, 3, popIn, popin 80%
}
