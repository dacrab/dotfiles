# Hyprland main config — modular: sources ./hyprland/colors.conf and ./configs/*.conf.

# ----- Shortcuts -----
$terminal = ghostty
$fileManager = nautilus
$menu = vicinae toggle

# ----- Sources -----
source = ~/.config/hypr/hyprland/colors.conf
source = ~/.config/hypr/configs/environment.conf
source = ~/.config/hypr/configs/input.conf
source = ~/.config/hypr/configs/keybindings.conf
source = ~/.config/hypr/configs/look_and_feel.conf
source = ~/.config/hypr/configs/window_rules.conf

# ----- Monitors (hardware-specific) -----
monitor = HDMI-A-1,1920x1080@74.97,0x0,1
monitor = eDP-1,disable

# ----- Autostart -----
exec-once = ~/.config/hypr/scripts/session-init
exec-once = hyprpaper
exec-once = ~/.local/bin/random-wall.sh
exec-once = vicinae server
exec-once = wayle panel start
