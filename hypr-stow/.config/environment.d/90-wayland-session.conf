# Wayland session variables for the systemd user manager.
#
# Programs started by systemd user units (e.g. the Vicinae launcher service)
# only inherit the *user manager* environment. Hyprland sets these variables
# with hl.env() for its own children, but that never reaches systemd, so
# services such as Vicinae were launching Chromium/Electron apps with
# --ozone-platform=x11 (and GTK/Qt apps with the X11 backend).
#
# Values intentionally match ~/.config/hypr/configs/environment.lua.
# Dynamic values (DISPLAY, WAYLAND_DISPLAY, XDG_CURRENT_DESKTOP) stay in
# ~/.config/hypr/scripts/session-init because they change per session.
XDG_SESSION_TYPE=wayland
XDG_SESSION_DESKTOP=Hyprland
GDK_BACKEND=wayland
QT_QPA_PLATFORM=wayland;xcb
SDL_VIDEODRIVER=wayland
MOZ_ENABLE_WAYLAND=1
ELECTRON_OZONE_PLATFORM_HINT=wayland
OZONE_PLATFORM=wayland
XCURSOR_SIZE=24
HYPRCURSOR_SIZE=24
GTK_USE_PORTAL=1
GTK_THEME=adw-gtk3-dark
