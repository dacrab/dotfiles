# ashell — bar + notification daemon (Hyprland), monochrome, GeistMono.
# workspaces left · clock centred · media, input language, tray and system
# glyphs right · notifications at the edge.

# ── General ───────────────────────────────────────────────────────────────────

outputs = { Targets = ["HDMI-A-1"] }  # external monitor only, never on eDP-1
layer = "Top"
position = "Top"
region = "en-GB"                      # metric units, 24h dates

# ── Behaviour ──────────────────────────────────────────────────────────────────

[osd]
enabled = true
timeout = 1500

[animations]
# Hyprland fades the surface; ashell only animates its own content.
enabled = true

# ── Modules ────────────────────────────────────────────────────────────────────
# No SystemInfo: CPU/RAM/temperature are deliberately not shown.

[modules]
left = ["Workspaces"]
center = ["Tempo"]
right = [["MediaPlayer", "KeyboardLayout", "Tray", "Settings"], "Notifications"]

[workspaces]
visibility_mode = "All"
group_by_monitor = false
indicator_format = "Name"        # numbers only, no app icons

[tempo]
clock_format = "%H:%M  %a %d %b"  # "20:41  Wed 28 Oct"

[keyboard_layout]
# Click the label to cycle the layout.
labels = { "English (US)" = "EN", "Greek" = "GR" }

[media_player]
# Icon only: no visualiser beside it or in the menu.
indicator_format = "Icon"

[settings]
battery_format = "Icon"
network_indicator_format = "Icon"
bluetooth_indicator_format = "Icon"
audio_indicator_format = "Icon"
microphone_indicator_format = "Icon"
brightness_indicator_format = "Icon"
volume_step = 5
max_volume = 100
# "More" buttons open GNOME's own panels.
audio_sinks_more_cmd = "gnome-control-center sound"
audio_sources_more_cmd = "gnome-control-center sound"
wifi_more_cmd = "gnome-control-center wifi"
vpn_more_cmd = "gnome-control-center network"
bluetooth_more_cmd = "gnome-control-center bluetooth"
lock_cmd = "swaylock"
suspend_cmd = "systemctl suspend"
reboot_cmd = "systemctl reboot"
shutdown_cmd = "systemctl poweroff"
logout_cmd = "loginctl kill-user $(whoami)"

[notifications]
show_bodies = true
grouped = true
toast = true
toast_position = "TopRight"
toast_timeout = 5000
toast_limit = 5

# ── Appearance ────────────────────────────────────────────────────────────────
# One grey, no accent: state reads as brightness rather than hue.

[appearance]
font_name = "GeistMono Nerd Font"
scale_factor = 0.9               # slim strip, like GNOME's bar
blur = "never"                   # blur breaks this Hyprland build
text_color = "#c9c9c9"           # nothing is pure white
warning_color = "#c9c9c9"        # mono: warnings are just brighter
danger_color = "#ececec"         # strongest light, for something wrong
success_color = "#c9c9c9"
workspace_colors = ["#c9c9c9"]   # active workspace reads by brightness

[appearance.primary_color]
base = "#c9c9c9"
text = "#1c1c1c"

[appearance.background_color]
base = "#1c1c1c"                 # neutral graphite
weak = "#262626"                 # menus, cards
strong = "#333333"               # borders, pressed states
text = "#c9c9c9"

[appearance.bar]
surface = "solid"                # one flat strip
padding = ["xxs", "sm"]

[appearance.opacity]
default = 1.0
bar = 1.0                        # opaque: see the note on blur above
menu = 0.97
notifications = 0.95

[appearance.menu]
backdrop = 0.0                   # no dimming behind menus
